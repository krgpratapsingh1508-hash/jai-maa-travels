<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Admin Panel - Jai Maa Travels Bookings</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Poppins',sans-serif;background:#f0f2f5;color:#333;}
header{background:linear-gradient(135deg,#1a1a2e,#0f3460);color:#fff;padding:20px 5%;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}
header h1{font-size:1.4rem;font-weight:700;}
header h1 span{color:#d4a017;}
.header-right{display:flex;gap:10px;align-items:center;}
.back-btn{background:rgba(255,255,255,.1);color:#fff;padding:8px 16px;border-radius:20px;text-decoration:none;font-size:.82rem;font-weight:600;transition:background .3s;}
.back-btn:hover{background:rgba(255,255,255,.2);}
.clear-btn{background:#c8102e;color:#fff;border:none;padding:8px 16px;border-radius:20px;font-size:.82rem;font-weight:600;cursor:pointer;}
.stats-row{display:flex;gap:15px;padding:25px 5%;flex-wrap:wrap;}
.stat-box{background:#fff;border-radius:14px;padding:20px 25px;flex:1;min-width:150px;box-shadow:0 2px 10px rgba(0,0,0,.07);border-left:4px solid #c8102e;}
.stat-box .num{font-size:2rem;font-weight:800;color:#c8102e;}
.stat-box .lbl{font-size:.8rem;color:#777;margin-top:2px;}
.container{padding:0 5% 40px;}
.filter-bar{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap;}
.filter-bar input,.filter-bar select{padding:9px 14px;border:2px solid #eee;border-radius:10px;font-family:'Poppins',sans-serif;font-size:.85rem;background:#fff;flex:1;min-width:160px;}
.filter-bar input:focus,.filter-bar select:focus{outline:none;border-color:#c8102e;}
.no-data{text-align:center;padding:60px;color:#aaa;}
.no-data i{font-size:3rem;display:block;margin-bottom:12px;}
table{width:100%;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.07);border-collapse:collapse;}
thead{background:linear-gradient(135deg,#1a1a2e,#0f3460);}
thead th{color:#fff;padding:14px 12px;text-align:left;font-size:.82rem;font-weight:600;white-space:nowrap;}
tbody tr{border-bottom:1px solid #f0f2f5;transition:background .2s;}
tbody tr:hover{background:#fff8f0;}
tbody td{padding:13px 12px;font-size:.82rem;vertical-align:middle;}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.72rem;font-weight:700;}
.badge-new{background:#e8f5e9;color:#2e7d32;}
.bid{font-weight:700;color:#c8102e;font-size:.8rem;}
.wa-link{display:inline-flex;align-items:center;gap:5px;background:#25d366;color:#fff;padding:5px 12px;border-radius:10px;text-decoration:none;font-size:.75rem;font-weight:700;transition:opacity .2s;}
.wa-link:hover{opacity:.85;}
.del-btn{background:#fff0f0;border:none;color:#c8102e;padding:5px 10px;border-radius:8px;cursor:pointer;font-size:.75rem;font-weight:700;}
.del-btn:hover{background:#c8102e;color:#fff;}
@media(max-width:768px){
  table{display:block;overflow-x:auto;}
  .stats-row{gap:10px;}
}
</style>
</head>
<body>

<header>
  <h1>🚗 <span>Jai Maa Travels</span> — Admin Panel</h1>
  <div class="header-right">
    <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Website Par Jaao</a>
    <button class="clear-btn" onclick="clearAll()"><i class="fas fa-trash"></i> Sab Clear Karo</button>
  </div>
</header>

<div class="stats-row">
  <div class="stat-box"><div class="num" id="totalCount">0</div><div class="lbl">Total Bookings</div></div>
  <div class="stat-box" style="border-color:#d4a017"><div class="num" style="color:#d4a017" id="todayCount">0</div><div class="lbl">Aaj Ki Bookings</div></div>
  <div class="stat-box" style="border-color:#25d366"><div class="num" style="color:#25d366" id="weddingCount">0</div><div class="lbl">Shaadi/Barat</div></div>
</div>

<div class="container">
  <div class="filter-bar">
    <input type="text" id="searchInput" placeholder="🔍 Naam ya mobile se dhundho..." onkeyup="filterBookings()"/>
    <select id="filterEvent" onchange="filterBookings()">
      <option value="">Sabhi Events</option>
      <option>Shaadi / Barat</option>
      <option>Reception</option>
      <option>Corporate Trip</option>
      <option>Pilgrim Tour</option>
      <option>Airport Transfer</option>
      <option>School/College Trip</option>
      <option>Kuch Aur</option>
    </select>
  </div>
  <div id="tableWrap"></div>
</div>

<script>
let allBookings = [];

function loadBookings(){
  allBookings = JSON.parse(localStorage.getItem('jmt_bookings') || '[]').reverse();
  updateStats();
  renderTable(allBookings);
}

function updateStats(){
  document.getElementById('totalCount').textContent = allBookings.length;
  const today = new Date().toLocaleDateString('en-IN');
  document.getElementById('todayCount').textContent = allBookings.filter(b=> new Date(b.time).toLocaleDateString('en-IN')===today || b.time.includes(new Date().toLocaleDateString('hi-IN'))).length;
  document.getElementById('weddingCount').textContent = allBookings.filter(b=>b.event && b.event.includes('Shaadi')).length;
}

function renderTable(data){
  const wrap = document.getElementById('tableWrap');
  if(data.length===0){
    wrap.innerHTML=`<div class="no-data"><i class="fas fa-inbox"></i><b>Koi booking nahi mili</b><br/>Jab customer form bharega, yahan dikhai dega.</div>`;
    return;
  }
  wrap.innerHTML=`<table>
    <thead><tr>
      <th>#</th><th>Booking ID</th><th>Naam</th><th>Mobile</th>
      <th>Occasion</th><th>Vehicle</th><th>Date</th><th>City</th>
      <th>Passengers</th><th>Budget</th><th>Details</th><th>Submitted</th><th>Actions</th>
    </tr></thead>
    <tbody>
    ${data.map((b,i)=>`<tr>
      <td>${i+1}</td>
      <td><span class="bid">${b.id||'—'}</span></td>
      <td><b>${b.naam}</b></td>
      <td>${b.mobile}</td>
      <td><span class="badge badge-new">${b.event}</span></td>
      <td>${b.vehicle}</td>
      <td>${b.date||'—'}</td>
      <td>${b.city||'—'}</td>
      <td>${b.pax||'—'}</td>
      <td>${b.budget||'—'}</td>
      <td style="max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${b.details||''}">${b.details||'—'}</td>
      <td style="white-space:nowrap;font-size:.75rem;color:#888">${b.time}</td>
      <td style="white-space:nowrap;">
        <a href="https://wa.me/91${b.mobile}?text=Namaste%20${encodeURIComponent(b.naam)}%2C%20Jai%20Maa%20Travels%20se%20aapki%20booking%20confirm%20ho%20gayi!" class="wa-link" target="_blank"><i class="fab fa-whatsapp"></i> Call</a>
        &nbsp;
        <button class="del-btn" onclick="deleteBooking('${b.id}')">🗑️</button>
      </td>
    </tr>`).join('')}
    </tbody>
  </table>`;
}

function filterBookings(){
  const s = document.getElementById('searchInput').value.toLowerCase();
  const ev = document.getElementById('filterEvent').value;
  const filtered = allBookings.filter(b=>{
    const matchSearch = !s || b.naam.toLowerCase().includes(s) || b.mobile.includes(s);
    const matchEvent = !ev || b.event===ev;
    return matchSearch && matchEvent;
  });
  renderTable(filtered);
}

function deleteBooking(id){
  if(!confirm('Yeh booking delete karein?')) return;
  let data = JSON.parse(localStorage.getItem('jmt_bookings') || '[]');
  data = data.filter(b=>b.id!==id);
  localStorage.setItem('jmt_bookings', JSON.stringify(data));
  loadBookings();
}

function clearAll(){
  if(!confirm('Sari bookings delete karein? Yeh undo nahi hoga!')) return;
  localStorage.removeItem('jmt_bookings');
  loadBookings();
}

loadBookings();
</script>
</body>
</html>
